name: Deploy React Vite to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the build on every push to main branch
  workflow_dispatch: # Allows you to trigger this manually from the UI

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTIONS: 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite outputs production build to 'dist'
          branch: gh-pages # Target deployment branch
